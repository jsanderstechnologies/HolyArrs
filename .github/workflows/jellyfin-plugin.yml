name: Jellyfin Plugin - Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'plugins/jellyfin-holyarrs/**'
      - '.github/workflows/jellyfin-plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plugin:
    name: Build Jellyfin Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish plugin
        run: dotnet publish plugins/jellyfin-holyarrs/Jellyfin.Plugin.HolyArrs.csproj -c Release -o plugins/jellyfin-holyarrs/dist

      - name: Package zip & compute checksum
        id: pkg
        run: |
          cd plugins/jellyfin-holyarrs/dist
          zip -j ../jellyfin-holyarrs_1.0.0.0.zip Jellyfin.Plugin.HolyArrs.dll
          cd ..
          md5=$(md5sum jellyfin-holyarrs_1.0.0.0.zip | awk '{print $1}')
          echo "md5=$md5" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Write manifest.json
        run: |
          cat > plugins/jellyfin-holyarrs/manifest.json <<EOF
          [
            {
              "guid": "a7b8c9d0-1234-4567-89ab-cdef01234567",
              "name": "HolyArrs",
              "overview": "Browse, search, and request movies & shows directly from Jellyfin into HolyArrs.",
              "description": "Integrates Jellyfin with HolyArrs (Torrentio + Premiumize.me cloud .strm workflow).",
              "owner": "jsanderstechnologies",
              "category": "General",
              "versions": [
                {
                  "version": "1.0.0.0",
                  "changelog": "Initial release with HolyArrs Discover & Request integration.",
                  "targetAbi": "10.10.0.0",
                  "sourceUrl": "https://github.com/${{ github.repository }}/releases/download/jellyfin-v1.0.0/jellyfin-holyarrs_1.0.0.0.zip",
                  "checksum": "${{ steps.pkg.outputs.md5 }}",
                  "timestamp": "${{ steps.pkg.outputs.ts }}"
                }
              ]
            }
          ]
          EOF

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jellyfin-v1.0.0
          name: Jellyfin Plugin v1.0.0
          files: plugins/jellyfin-holyarrs/jellyfin-holyarrs_1.0.0.0.zip

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/jellyfin-holyarrs/manifest.json
          git diff --cached --quiet || (git commit -m "Update Jellyfin plugin manifest.json [skip ci]" && git push)
